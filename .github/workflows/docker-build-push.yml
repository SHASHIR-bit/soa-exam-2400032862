name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Frontend and Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image settings
        id: image_settings
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "backend_image=${DOCKERHUB_USERNAME}/docker-backend-2400032862" >> "$GITHUB_OUTPUT"
            echo "frontend_image=${DOCKERHUB_USERNAME}/docker-frontend-2400032862" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "push=true" >> "$GITHUB_OUTPUT"
            else
              echo "push=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "backend_image=docker-backend-2400032862" >> "$GITHUB_OUTPUT"
            echo "frontend_image=docker-frontend-2400032862" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: ${{ steps.image_settings.outputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build and Push Backend Image (Student ID: 2400032862)
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ steps.image_settings.outputs.push == 'true' }}
          tags: |
            ${{ steps.image_settings.outputs.backend_image }}:latest
            ${{ steps.image_settings.outputs.backend_image }}:${{ github.sha }}

      # 2. Build and Push Frontend Image (Student ID: 2400032862)
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ steps.image_settings.outputs.push == 'true' }}
          tags: |
            ${{ steps.image_settings.outputs.frontend_image }}:latest
            ${{ steps.image_settings.outputs.frontend_image }}:${{ github.sha }}
