name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Frontend and Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials
        id: check_creds
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN }}
        run: |
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASS" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "docker_user=$DOCKER_USER" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "should_push=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_push=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "docker_user=shashirbit" >> "$GITHUB_OUTPUT"
            echo "should_push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials not found. Building images without pushing to verify build integrity."
          fi

      - name: Log in to Docker Hub
        if: ${{ steps.check_creds.outputs.has_creds == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ steps.check_creds.outputs.docker_user }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN }}

      # 1. Build and Push Backend Image (Student ID: 2400032862)
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ steps.check_creds.outputs.should_push == 'true' }}
          load: ${{ steps.check_creds.outputs.should_push != 'true' }}
          tags: |
            ${{ steps.check_creds.outputs.docker_user }}/docker-backend-2400032862:latest
            ${{ steps.check_creds.outputs.docker_user }}/docker-backend-2400032862:${{ github.sha }}

      # 2. Build and Push Frontend Image (Student ID: 2400032862)
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ steps.check_creds.outputs.should_push == 'true' }}
          load: ${{ steps.check_creds.outputs.should_push != 'true' }}
          tags: |
            ${{ steps.check_creds.outputs.docker_user }}/docker-frontend-2400032862:latest
            ${{ steps.check_creds.outputs.docker_user }}/docker-frontend-2400032862:${{ github.sha }}
